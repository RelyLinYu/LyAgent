- id: llm-deepseek
  disabled: true
- id: session-title-llm
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
    - id: lyagent-present
      name: '@deepseek-ai/dsh-tool-present'
    - id: lyagent-artifact-gate
      name: '@deepseek-ai/dsh-lyagent-artifact-acceptance'
      config:
        artifacts:
          - path: result.md
            minBytes: 1
            maxBytes: 128
            includes: [required]
